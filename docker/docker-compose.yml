# Phase 8 "just run it" demo stack -- see shared/phased-implementation-plan.md's Phase 8 item 2
# and shared/devops-pipeline-overview.md#2-the-docker-compose-smoke-test for how this differs
# from the (separate, not-yet-built) two-backend smoke-test topology.
#
# One frontend + one backend + one database, picked with Compose profiles:
#
#   API_BASE_URL=http://localhost:8080/api/v1 docker compose --profile react   --profile spring  up --build
#   API_BASE_URL=http://localhost:3000/api/v1 docker compose --profile react   --profile node    up --build
#   API_BASE_URL=http://localhost:8080/api/v1 docker compose --profile angular --profile spring  up --build
#   API_BASE_URL=http://localhost:3000/api/v1 docker compose --profile angular --profile node    up --build
#
# Postgres is published on the host as 5433, not 5432, so this can run alongside the native
# PostgreSQL used for day-to-day local development (see devops-pipeline-overview.md's "Local
# development" section -- that workflow is untouched by any of this).
#
# Phase 9 adds a fifth, additive combination -- the AI service, under --profile ai:
#
#   API_BASE_URL=http://localhost:8080/api/v1 OPENAI_API_KEY=sk-... \
#     docker compose --profile react --profile spring --profile ai up --build
#
# This requires the `db` image below to be pgvector-capable (see stacks/ai-service/
# environment-setup-guide.md#1-the-database-needs-pgvector-and-the-stock-image-does-not-have-it)
# -- the four combinations above are unaffected and still run with no OPENAI_API_KEY at all.

name: hotelapp

services:
  db:
    # pgvector/pgvector:pg18, NOT postgres:18.6 -- the official image ships no third-party
    # extensions, and `CREATE EXTENSION vector` (in V002__ai_tables.sql) fails with the control
    # file simply absent. This is unconditional, not profile-gated: V002 runs on every Compose
    # combination regardless of whether --profile ai is used.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotelapp
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18's image expects the mount at the parent dir, not .../data directly -- it
      # manages a major-version-specific subdirectory itself now (pg_ctlcluster-compatible layout).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotelapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:11
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../shared/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://db:5432/hotelapp
      - -user=postgres
      - -password=postgres
      - -connectRetries=10
      - migrate

  seed:
    image: postgres:18.6
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotelapp
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["sh", "/seed/run-seed.sh"]

  api-spring:
    profiles: [spring]
    build:
      context: ../../hotelapp-server-springboot
      dockerfile: Dockerfile
      additional_contexts:
        hotelapp-context: ..
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hotelapp
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4200
    ports:
      - "8080:8080"

  api-node:
    profiles: [node]
    build:
      context: ../../hotelapp-server-nodejs
      dockerfile: Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hotelapp
      PORT: 3000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4200
    ports:
      - "3000:3000"

  web-react:
    profiles: [react]
    build:
      context: ../../hotelapp-client-react
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "5173:80"

  web-angular:
    profiles: [angular]
    build:
      context: ../../hotelapp-client-angular
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "4200:80"

  api-ai:
    profiles: [ai]
    build:
      context: ../../hotelapp-ai-service
      dockerfile: Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      # Inside the Compose network, not the host-facing API_BASE_URL above -- defaults to the
      # Spring Boot service name; override AI_BACKEND_URL when pairing with --profile node.
      HOTELAPP_API_BASE_URL: ${AI_BACKEND_URL:-http://api-spring:8080/api/v1}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hotelapp
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4200
    ports:
      - "8000:8000"

volumes:
  pgdata:
